services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planparse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planparse_dev}
      POSTGRES_DB: ${POSTGRES_DB:-planparse}
    ports: ["5432:5432"]
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [redis_data:/data]


volumes:
  db_data:
  redis_data:
